<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho com título e subtítulo -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- Área dos cards de resumo (preenchidos pelo JS) -->
    <section class="cards-resumo" id="cardsResumo">
      <!-- Os cards serão criados automaticamente pelo script.js -->
    </section>

    <!-- Tabela do boletim (preenchida pelo JS) -->
    <section class="area-tabela">
      <h2>Notas por Disciplina</h2>
      <div class="tabela-wrapper">
        <table class="tabela-boletim">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <!-- As linhas serão criadas automaticamente pelo script.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para fins de estudo.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
